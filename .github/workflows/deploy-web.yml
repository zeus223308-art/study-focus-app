name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Export web
        env:
          EXPO_PUBLIC_BASE_PATH: /study-focus-app
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: npx expo export --platform web && node scripts/inject-web-shell.mjs && node scripts/transpile-web-legacy.mjs

      - name: Verify splash tagline is English only
        run: |
          if grep -r '기억을 정복' dist/_expo/static/js/web/ 2>/dev/null; then
            echo 'ERROR: Korean splash tagline found in web bundle'
            exit 1
          fi
          if ! grep -r 'Conquer your memory' dist/_expo/static/js/web/; then
            echo 'ERROR: English splash tagline missing from web bundle'
            exit 1
          fi

      - name: Verify Files tab has no per-subject archive buttons
        run: |
          if grep -r 'onSubjectArchivePress' dist/_expo/static/js/web/ 2>/dev/null; then
            echo 'ERROR: Files tab still bundles vault archive tile handlers'
            exit 1
          fi

      - name: GitHub Pages SPA fallback + auto-update
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          printf '{"build":"%s"}' "${GITHUB_SHA}" > dist/version.json
          node -e '
            const fs = require("fs");
            const build = process.env.GITHUB_SHA;
            const head =
              "<meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\">" +
              "<meta http-equiv=\"Pragma\" content=\"no-cache\">" +
              "<meta http-equiv=\"Expires\" content=\"0\">" +
              "<meta name=\"app-build\" content=\"" + build + "\">" +
              "<script>(function(){try{var c=" + JSON.stringify(build) +
              ";fetch(\"/study-focus-app/version.json?ts=\"+Date.now(),{cache:\"no-store\"})" +
              ".then(function(r){return r&&r.ok?r.json():null;})" +
              ".then(function(j){if(!j||!j.build||j.build===c)return;" +
              "var k=\"app-build-reloaded\";if(sessionStorage.getItem(k)===j.build)return;" +
              "sessionStorage.setItem(k,j.build);var u=new URL(location.href);" +
              "u.searchParams.set(\"u\",j.build);location.replace(u.toString());})" +
              ".catch(function(){});}catch(e){}})();</script>";
            for (const f of ["dist/index.html", "dist/404.html"]) {
              let html = fs.readFileSync(f, "utf8");
              html = html.replace("<head>", "<head>" + head);
              html += "\n<!-- deploy " + new Date().toISOString() + " " + build + " -->";
              fs.writeFileSync(f, html);
            }
          '

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: false
